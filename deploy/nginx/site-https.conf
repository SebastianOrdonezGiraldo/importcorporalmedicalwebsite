# Requires a certificate covering BOTH names. Never enable before issuance.
server {
    listen 80;
    listen [::]:80;
    server_name importcorporalmedical.com www.importcorporalmedical.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/icm-website-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://www.importcorporalmedical.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name importcorporalmedical.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/importcorporalmedical.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/importcorporalmedical.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://www.importcorporalmedical.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.importcorporalmedical.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/importcorporalmedical.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/importcorporalmedical.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        # This is the public edge: discard client-supplied proxy identity headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_cache off;
    }
}
