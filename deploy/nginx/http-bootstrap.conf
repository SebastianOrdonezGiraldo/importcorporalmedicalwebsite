# Install only for the HTTP-01 certificate bootstrap, after preparing the app.
server {
    listen 80;
    listen [::]:80;
    server_name importcorporalmedical.com www.importcorporalmedical.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/icm-website-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 120 always;
        return 503;
    }
}
