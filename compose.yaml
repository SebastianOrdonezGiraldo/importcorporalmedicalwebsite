name: icm-website
services:
  web:
    image: ${APP_IMAGE:?Define APP_IMAGE con la versión o el ID de imagen}
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:?Define SITE_URL}
        STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        APP_VERSION: ${APP_VERSION:-unreleased}
        GIT_REVISION: ${GIT_REVISION:-unknown}
    pull_policy: never
    env_file:
      - path: ${ICM_ENV_FILE:-./deploy/production.env}
        format: raw
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: "3000"
    ports:
      - "127.0.0.1:${ICM_HTTP_PORT:-3010}:3000"
    volumes:
      - catalog-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  catalog-data:
    name: ${ICM_DATA_VOLUME:-icm-website-data}
